async function login(){
 const owner=/[?&]host=1/.test(location.search);
 view(`<div class="card"><img class="crest" src="${FLAG}" alt=""><h1>مسابقة العائلة العمانية</h1><div class="orn"></div><p class="sub">أهلاً بكم! اكتب اسمك وكود الانضمام</p>
 <input id="nm" placeholder="الاسم الثنائي أو الثلاثي" maxlength="40"><input id="cd" placeholder="كود الانضمام (4 أرقام)" inputmode="numeric" maxlength="4">
 <button class="btn" id="go">دخول</button>${owner?'<button class="btn g" id="host">أنا مقدّم المسابقة</button>':''}<p class="sub" id="er"></p></div>`);
 const hm=location.hash.match(/^#c(\d{4})$/);if(hm)$("#cd").value=hm[1];
 $("#go").onclick=async()=>{const n=$("#nm").value.trim(),c=$("#cd").value.trim();if(n.length<3||c.length!=4){$("#er").textContent="يرجى كتابة الاسم وكود من 4 أرقام";return}
  me.name=n;if(!(await connect(c)))return;G.emit("p",{t:"join",id:me.id,name:n});
  $("#mm").innerHTML="أهلاً بك يا "+esc(n)+"\n\nيسعدنا انضمامك إلينا، وشكراً لحضورك وتفاعلك الجميل الذي يزيد المجلس بهجةً وأُنساً. نتمنى لك وقتاً ممتعاً، وحظاً موفقاً، وكل التشجيع لك في هذه المنافسة الودّية!\n\n<b>مع تحيات عائلة خالد الكندي</b>";
  $("#modal").classList.add("on");$("#mc").onclick=()=>{$("#modal").classList.remove("on");burst();waitP()}};
 if(owner)$("#host").onclick=async()=>{const c=String(1000+Math.random()*9000|0);if(await connect(c)){isHost=true;hostLobby(c)}};
}
async function connect(c){return new Promise(res=>{const L={};let rdy=false;
 G={on:(t,f)=>{(L[t]=L[t]||[]).push(f)},emit:(t,d)=>fetch("/emit",{method:"POST",body:JSON.stringify({c,t,d})}).catch(()=>{})};
 const es=new EventSource("/events");
 es.onmessage=e=>{const m=JSON.parse(e.data);if(m.c!==c)return;(L[m.t]||[]).forEach(f=>f({data:m.d}))};
 es.onopen=()=>{if(rdy)return;rdy=true;G.on("h",m=>onH(m.data));G.on("p",m=>isHost&&onP(m.data));res(true)};
 setTimeout(()=>{if(!rdy){const x=$("#er");if(x)x.textContent="تعذّر الاتصال بالخادم، تأكد أنك على نفس شبكة الواي فاي";res(false)}},6000)})}
const waitP=()=>view(`<div class="card"><h2>تم تسجيلك</h2><p class="sub big">بانتظار بدء المسابقة من المقدّم…</p></div>`);
/* ===== المقدّم ===== */
const H={pl:{},order:[],qi:-1,cur:null,base:20};
async function hostLobby(c){H.code=c;try{const i=await (await fetch("/info")).json();if(/^(localhost|127\.)/.test(location.hostname)&&i.ip)URL0="http://"+i.ip+":"+i.port+"/"}catch(e){}draw()}
function draw(){const n=Object.keys(H.pl).length;
 view(`<div class="card"><h1>انضموا إلى المسابقة</h1><div class="orn"></div><div id="qr" style="display:grid;place-items:center;background:#fff;border-radius:14px;padding:12px;margin:8px auto;width:fit-content"></div><p class="sub">امسحوا الرمز بكاميرا الهاتف ثم اكتبوا أسماءكم<br>الكود احتياطاً: <b>${H.code}</b><small style="display:block;direction:ltr;word-break:break-all;margin-top:6px">${URL0}</small></p><h2>المشاركون (${n})</h2><div class="sub">${Object.values(H.pl).map(p=>esc(p.name)).join(" • ")||"—"}</div>${H.qi<0?'<p class="sub">زمن السؤال: <input id="tq" type="number" min="10" max="90" value="'+H.base+'" style="width:90px;display:inline-block"> ثانية (+10 لأسئلة الثمانية خيارات)</p><button class="btn" id="st" '+(n?"":"disabled")+'>ابدأ المسابقة</button>':""}</div>`);
 mkQR();const tq=$("#tq");if(tq)tq.onchange=()=>{H.base=Math.max(10,Math.min(90,+tq.value||20))};const b=$("#st");if(b)b.onclick=startQuiz}
function mkQR(){const el=$("#qr");if(!el)return;try{const q=qrcode(0,"M");q.addData(URL0+"#c"+H.code);q.make();el.innerHTML=q.createSvgTag(5,2)}catch(e){el.innerHTML='<div style="color:#000;direction:ltr;word-break:break-all;max-width:260px">'+URL0+'</div>'}}
function onP(d){if(d.t=="join"){H.pl[d.id]=H.pl[d.id]||{name:d.name.slice(0,40),score:0};if(H.qi<0)draw()}
 else if(d.t=="ans"&&H.cur&&H.cur.open&&H.pl[d.id]&&!H.cur.a[d.id]){H.cur.a[d.id]={c:d.c,ms:Math.min(Date.now()-H.cur.t0,H.cur.dur*1000)}}}
function startQuiz(){H.order=shuf([...Q4.map(q=>[q,4]),...Q8.map(q=>[q,8])]);H.qi=-1;next()}
function next(){H.qi++;if(H.qi>=H.order.length)return endQuiz();
 const [q]=H.order[H.qi],right=q[1],opts=shuf(q.slice(1)),dur=(opts.length==8?10:0)+H.base;
 H.cur={open:true,a:{},t0:Date.now(),dur,opts,right:opts.indexOf(right),q:q[0]};
 let rem=dur;const pub=()=>{const s={phase:"q",qi:H.qi,n:H.order.length,q:H.cur.q,opts,rem,dur};S=s;onH(s);G.emit("h",s)};
 pub();clearInterval(tick);tick=setInterval(()=>{rem--;if(rem<=0){clearInterval(tick);reveal()}else pub()},1000)}
function reveal(){const c=H.cur;c.open=false;const ok=Object.entries(c.a).filter(([,v])=>v.c==c.right).sort((a,b)=>a[1].ms-b[1].ms);
 ok.forEach(([id,v])=>H.pl[id].score+=500+Math.round(500*(1-v.ms/(c.dur*1000))));
 const sc={};Object.entries(H.pl).forEach(([id,p])=>sc[id]=p.score);
 const s={phase:"rev",qi:H.qi,n:H.order.length,q:c.q,opts:c.opts,right:c.right,top:ok.slice(0,5).map(([id,v])=>[H.pl[id].name,(v.ms/1000).toFixed(1)]),sc,ans:Object.fromEntries(Object.entries(c.a).map(([k,v])=>[k,v.c]))};
 S=s;onH(s);G.emit("h",s);let w=8;clearInterval(tick);tick=setInterval(()=>{if(--w<=0){clearInterval(tick);next()}else G.emit("h",s)},1000)}
function endQuiz(){const r=Object.values(H.pl).sort((a,b)=>b.score-a.score).slice(0,3).map(p=>[p.name,p.score]);const s={phase:"end",pod:r};S=s;onH(s);G.emit("h",s);clearInterval(tick);tick=setInterval(()=>G.emit("h",s),3000)}
/* ===== عرض حالة المسابقة (للجميع) ===== */
let lastKey="";
function onH(s){if(!s||!s.phase)return;S=s;
 if(s.phase=="q"){const k="q"+s.qi;if(lastKey!=k){lastKey=k;mySel=null;renderQ(s)}
  $("#tm").textContent=s.rem;$("#br").style.width=(s.rem/s.dur*100)+"%"}
 else if(s.phase=="rev"){const k="r"+s.qi;if(lastKey!=k){lastKey=k;renderR(s)}}
 else if(s.phase=="end"&&lastKey!="end"){lastKey="end";renderEnd(s)}}
function renderQ(s){const e=s.opts.length==8;
 view(`<div class="card"><div class="row"><span>السؤال ${s.qi+1} / ${s.n}</span><span class="t" id="tm">${s.rem}</span></div><div class="bar"><i id="br" style="width:100%"></i></div><div class="big">${esc(s.q)}</div>
 <div class="opts ${e?"e":""}">${s.opts.map((o,i)=>`<button class="o" data-i="${i}" ${isHost?"disabled":""}><b>${LET[i]}</b>${esc(o)}</button>`).join("")}</div><p class="sub" id="ok"></p></div>`);
 if(!isHost)document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{if(mySel!==null)return;mySel=+b.dataset.i;b.classList.add("sel");document.querySelectorAll(".o").forEach(x=>x.disabled=true);$("#ok").textContent="تم تسجيل إجابتك، انتظر انتهاء الوقت";G.emit("p",{t:"ans",id:me.id,c:mySel})})}
function renderR(s){const mine=isHost?null:s.ans&&s.ans[me.id];
 const rank=Object.entries(s.sc).sort((a,b)=>b[1]-a[1]);
 view(`<div class="card"><div class="big">${esc(s.q)}</div><div class="opts ${s.opts.length==8?"e":""}">${s.opts.map((o,i)=>`<div class="o ${i==s.right?"ok":i===mine?"no":""}"><b>${LET[i]}</b>${esc(o)}</div>`).join("")}</div>
 ${isHost?"":`<p class="sub big">${mine===undefined?"لم تجب":mine==s.right?"إجابة صحيحة":"للأسف إجابة خاطئة"} — نقاطك: ${s.sc[me.id]||0}</p>`}</div>
 <div class="card"><h2>الخمسة الأسرع والأصح</h2><div class="orn"></div>${s.top.length?"<ol>"+s.top.map(t=>`<li>${esc(t[0])} <small>(${t[1]} ث)</small></li>`).join("")+"</ol>":'<p class="sub">لم يُجب أحد إجابة صحيحة</p>'}</div>`);
 if(s.top.length)burst()}
function renderEnd(s){const p=s.pod,m=["١","٢","٣"];
 view(`<div class="card"><h1>منصة التتويج</h1><div class="orn"></div><p class="sub">مبارك للفائزين وشكراً لكل المشاركين</p><div class="pod">${[1,0,2].filter(i=>p[i]).map(i=>`<div class="p${i+1}"><div class="med">${m[i]}</div>${esc(p[i][0])}<br>${p[i][1]}</div>`).join("")}</div>
 <p class="sub"><b>مع تحيات عائلة خالد الكندي</b></p></div>`);
 burst();setInterval(burst,2500)}
login();
</script>
</body>
</html>
